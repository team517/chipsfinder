server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Herramienta interna: que no la indexen buscadores ni se pueda incrustar en otras webs
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fotos y logo
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Pulso Studio (edición y programación de vídeos): otro servicio de EasyPanel, servido aquí
    # para que vaya dentro del panel con la misma sesión. STUDIO_UPSTREAM lo fija el Dockerfile o EasyPanel.
    location = /studio {
        return 301 /studio/;
    }
    location /studio/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $studio_upstream "${STUDIO_UPSTREAM}";
        proxy_pass $studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        # Vídeos grandes: sin límite de tamaño y sin guardarlos enteros en nginx
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App de una sola página: /panel/... y cualquier otra ruta sirven index.html.
    # index.html nunca se guarda en caché, para que tras "Implementar" se vea la versión nueva.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
